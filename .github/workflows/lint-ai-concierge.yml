name: Personal AI Concierge

on:
  push:
  workflow_dispatch: # Permite rodar manualmente para testar

jobs:
  ping-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Health
        run: |
          echo "Checking AI Concierge Health on Render..."

          # O parâmetro -f (fail) faz o curl retornar erro se o status HTTP for 4xx ou 5xx
          if curl -f https://ai-concierge-motor.onrender.com/health; then
            echo "✅ AI Concierge is operational!"
          else
            echo "❌ AI Concierge is offline or returned an error!"
            exit 1 # Força a falha do job no GitHub Actions
          fi
