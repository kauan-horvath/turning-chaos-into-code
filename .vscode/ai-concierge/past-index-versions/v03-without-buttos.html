<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concierge de Portfólio</title>
    <style>
        /* Reset e Base */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; display: flex; height: 100vh; overflow: hidden; }

        /* BARRA LATERAL */
        .sidebar { width: 300px; background-color: #ffffff; padding: 24px; display: flex; flex-direction: column; gap: 24px; border-right: 1px solid #e2e8f0; overflow-y: auto; }
        .sidebar h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; margin-bottom: 8px; }
        .info-card { background-color: #f1f5f9; padding: 16px; border-radius: 12px; font-size: 14px; color: #475569; border: 1px solid #e2e8f0; }
        .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .contact-btn { background-color: #fff; border: 1px solid #cbd5e1; padding: 10px; border-radius: 8px; text-align: center; text-decoration: none; color: #334155; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .contact-btn:hover { background-color: #f8fafc; border-color: #94a3b8; }
        .contact-btn.full-width { grid-column: span 2; background-color: #2563eb; color: white; border: none; }
        .contact-btn.full-width:hover { background-color: #1d4ed8; }
        .quick-questions { display: flex; flex-direction: column; gap: 10px; }
        .quick-btn { background-color: #fff; border: 1px solid #e2e8f0; padding: 12px 14px; border-radius: 10px; text-align: left; font-size: 13px; color: #334155; cursor: pointer; transition: 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .quick-btn:hover { border-color: #2563eb; color: #2563eb; transform: translateY(-1px); }
        .arcade-btn { background-color: #fff7ed; border: 1px solid #fed7aa; color: #c2410c; }

        /* ÁREA DE CHAT */
        .main-chat { flex: 1; display: flex; flex-direction: column; background-color: #ffffff; }
        .chat-history { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 32px; scroll-behavior: smooth; }

        /* Estilização das Mensagens */
        .message { max-width: 75%; padding: 14px 20px; border-radius: 20px; font-size: 15px; line-height: 1.7; position: relative; }
        .message.user { background-color: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2); }
        .message.ai { background-color: #ffffff; align-self: flex-start; color: #1e293b; border: 1px solid #f1f5f9; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }

        /* Formatação Visual para Respostas da IA (Escaneabilidade) */
        .message.ai b, .message.ai strong { color: #2563eb; font-weight: 700; }
        .message.ai br { content: ""; display: block; margin: 12px 0; }
        .message.ai p { margin-bottom: 10px; }
        .message.ai ul { margin: 12px 0 12px 24px; }
        .message.ai li { margin-bottom: 8px; list-style-type: '⚡ '; }

        /* INPUT */
        .input-container { padding: 30px; display: flex; justify-content: center; background: linear-gradient(0deg, #ffffff 0%, rgba(255,255,255,0) 100%); }
        .input-wrapper { display: flex; align-items: center; width: 100%; max-width: 850px; background-color: #f1f5f9; border-radius: 24px; padding: 10px 20px; transition: 0.3s; border: 2px solid transparent; }
        .input-wrapper:focus-within { background-color: #ffffff; border-color: #2563eb; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .input-wrapper input { flex: 1; border: none; background: transparent; padding: 12px; font-size: 16px; outline: none; color: #1e293b; }
        .input-wrapper button { background: #2563eb; border: none; cursor: pointer; padding: 10px; border-radius: 14px; display: flex; transition: 0.2s; }
        .input-wrapper button:hover { transform: scale(1.05); background-color: #1d4ed8; }
        .send-icon { width: 22px; height: 22px; fill: white; }

        /* Loading Animado */
        .typing-indicator { color: #64748b; font-size: 14px; display: flex; align-items: center; gap: 8px; padding: 10px 20px; }
        .dot { width: 6px; height: 6px; background: #94a3b8; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div>
            <h2>👤 Perfil</h2>
            <div class="info-card">
                <strong>Kauan Horvath</strong><br>
                <p style="margin-top:5px; opacity:0.8;">Desenvolvedor Fullstack</p>
                <p style="margin-top:5px; color:#16a34a; font-weight:600;">● Aberto a propostas</p>
            </div>
        </div>

        <div>
            <h2>🔗 Conecte-se</h2>
            <div class="contact-grid">
                <a href="#" target="_blank" class="contact-btn">LinkedIn</a>
                <a href="#" target="_blank" class="contact-btn">GitHub</a>
                <a href="mailto:seuemail@exemplo.com" class="contact-btn full-width">📧 Enviar E-mail</a>
            </div>
        </div>

        <div>
            <h2>💡 Atalhos</h2>
            <div class="quick-questions">
                <button class="quick-btn" onclick="sendQuickMessage('Quais são as suas principais habilidades?')">⚙️ Stack e Ferramentas</button>
                <button class="quick-btn" onclick="sendQuickMessage('Me fale sobre sua experiência com Python.')">🐍 Python e Automações</button>
                <button class="quick-btn" onclick="sendQuickMessage('Como posso baixar seu currículo?')">📄 Baixar Currículo</button>
                <button class="quick-btn" onclick="sendQuickMessage('Qual seu projeto de maior destaque?')">🚀 Projeto Principal</button>
            </div>
        </div>

        <div>
            <h2>🕹️ Lúdico</h2>
            <button class="quick-btn arcade-btn" onclick="spawnStandaloneGame()" style="width: 100%;">Modo Arcade (Snake)</button>
        </div>
    </aside>

    <main class="main-chat">
        <div class="chat-history" id="chat-history">
            <div class="message ai">
                ✨ <b>Olá!</b> Sou o seu guia virtual.<br>
                Estou aqui para facilitar sua navegação pelo portfólio do <b>Kauan</b>. O que você gostaria de descobrir primeiro?
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="Pergunte algo ao concierge..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()"><svg class="send-icon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
            </div>
        </div>
    </main>

    <script>
        let isFirstLoad = true;
        let stopLoadingGame = null;

        function startSnakeGame(canvas) {
            const ctx = canvas.getContext('2d');
            const box = 10;
            let snake = [{x: 10 * box, y: 10 * box}];
            let direction = "RIGHT";
            let food = { x: Math.floor(Math.random() * 19 + 1) * box, y: Math.floor(Math.random() * 19 + 1) * box };
            const keyHandler = (e) => {
                if ([37, 38, 39, 40].includes(e.keyCode)) e.preventDefault();
                if (e.keyCode == 37 && direction != "RIGHT") direction = "LEFT";
                else if (e.keyCode == 38 && direction != "DOWN") direction = "UP";
                else if (e.keyCode == 39 && direction != "LEFT") direction = "RIGHT";
                else if (e.keyCode == 40 && direction != "UP") direction = "DOWN";
            };
            document.addEventListener("keydown", keyHandler);
            function draw() {
                ctx.clearRect(0, 0, 200, 200);
                for (let i = 0; i < snake.length; i++) {
                    ctx.fillStyle = (i == 0) ? "#2563eb" : "#93c5fd";
                    ctx.fillRect(snake[i].x, snake[i].y, box, box);
                }
                ctx.fillStyle = "#ef4444";
                ctx.fillRect(food.x, food.y, box, box);
                let snakeX = snake[0].x; let snakeY = snake[0].y;
                if (direction == "LEFT") snakeX -= box; if (direction == "UP") snakeY -= box;
                if (direction == "RIGHT") snakeX += box; if (direction == "DOWN") snakeY += box;
                if (snakeX == food.x && snakeY == food.y) {
                    food = { x: Math.floor(Math.random() * 19 + 1) * box, y: Math.floor(Math.random() * 19 + 1) * box };
                } else { snake.pop(); }
                if (snakeX < 0) snakeX = 200 - box; if (snakeX >= 200) snakeX = 0;
                if (snakeY < 0) snakeY = 200 - box; if (snakeY >= 200) snakeY = 0;
                snake.unshift({x: snakeX, y: snakeY});
            }
            let gameInterval = setInterval(draw, 100);
            return () => { clearInterval(gameInterval); document.removeEventListener("keydown", keyHandler); };
        }

        function createSnakeGameElement(isStandalone = false) {
            const container = document.createElement('div');
            container.className = 'message ai';
            if (!isStandalone) container.id = 'loading-indicator';
            container.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:12px; background:#f8fafc; border:1px solid #e2e8f0;';
            const text = document.createElement('span');
            text.style.fontSize = '13px';
            text.innerHTML = isStandalone ? '<b>Modo Arcade</b> 🎮' : '🚀 Acordando o servidor... <b>Jogue enquanto espera!</b>';
            const canvas = document.createElement('canvas'); canvas.width = 200; canvas.height = 200; canvas.style.backgroundColor = '#fff'; canvas.style.borderRadius = '12px';
            container.appendChild(text); container.appendChild(canvas);
            return { container, canvas };
        }

        function spawnStandaloneGame() {
            appendUserMessage("🕹️ Vou jogar um pouco!");
            const { container, canvas } = createSnakeGameElement(true);
            document.getElementById('chat-history').appendChild(container);
            scrollToBottom();
            startSnakeGame(canvas);
        }

        function appendUserMessage(text) {
            const div = document.createElement('div'); div.className = 'message user'; div.textContent = text;
            document.getElementById('chat-history').appendChild(div); scrollToBottom();
        }

        function appendAiMessage(html) {
            const div = document.createElement('div'); div.className = 'message ai';
            const formatted = html.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                                  .replace(/\n\* /g, '<br>• ')
                                  .replace(/\n/g, '<br>');
            div.innerHTML = formatted;
            document.getElementById('chat-history').appendChild(div); scrollToBottom();
        }

        function scrollToBottom() { const h = document.getElementById('chat-history'); h.scrollTop = h.scrollHeight; }
        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
        function sendQuickMessage(t) { document.getElementById('user-input').value = t; sendMessage(); }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message) return;

            appendUserMessage(message);
            input.value = '';
            const history = document.getElementById('chat-history');

            if (isFirstLoad) {
                const { container, canvas } = createSnakeGameElement(false);
                history.appendChild(container); scrollToBottom();
                stopLoadingGame = startSnakeGame(canvas);
            } else {
                const loading = document.createElement('div');
                loading.id = 'loading-indicator'; loading.className = 'message ai typing-indicator';
                loading.innerHTML = '⚡ Pensando <div class="dot"></div><div class="dot"></div><div class="dot"></div>';
                history.appendChild(loading); scrollToBottom();
            }

            let success = false;
            let reply = "";

            try {
                const response = await fetch('https://ai-concierge-motor.onrender.com/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();
                if (data.reply) { reply = data.reply; success = true; isFirstLoad = false; }
            } catch (e) { console.error(e); }

            if (stopLoadingGame) { stopLoadingGame(); stopLoadingGame = null; }
            const indicator = document.getElementById('loading-indicator');
            if (indicator) indicator.remove();

            if (success) {
                appendAiMessage(reply);
            } else {
                isFirstLoad = true;
                appendAiMessage("🔧 <b>O motor está em manutenção.</b><br>Por favor, tente novamente em instantes ou entre em contato direto.");
            }
        }
    </script>
</body>
</html>
